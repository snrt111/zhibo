management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,configprops,httptrace,threaddump,heapdump,scheduledtasks,mappings,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
