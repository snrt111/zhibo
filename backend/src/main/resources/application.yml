sms:
  aliyun:
    enabled: ${SMS_ALIYUN_ENABLED:false}
    access-key-id: ${SMS_ALIYUN_ACCESS_KEY_ID:your_access_key_id}
    access-key-secret: ${SMS_ALIYUN_ACCESS_KEY_SECRET:your_access_key_secret}
    region-id: ${SMS_ALIYUN_REGION_ID:cn-hangzhou}
    sign-name: ${SMS_ALIYUN_SIGN_NAME:您的签名}
    template-code: ${SMS_ALIYUN_TEMPLATE_CODE:SMS_123456789}

#upload:
#  path: ${UPLOAD_PATH:/app/uploads}
