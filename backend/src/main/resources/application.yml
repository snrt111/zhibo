server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
    session:
      timeout: ${SESSION_TIMEOUT:30m}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE:10}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:20s}
    max-http-form-post-size: ${TOMCAT_MAX_POST_SIZE:2MB}
