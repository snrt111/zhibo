#  secretKey: ${MINIO_SECRET_KEY:minioadmin123}
#  bucketName: ${MINIO_BUCKET_NAME:zhibo-files}
#
justauth:
  enabled: true
  type:
    GITHUB:
      client-id: ${JUSTAUTH_GITHUB_CLIENT_ID:your_github_client_id}
      client-secret: ${JUSTAUTH_GITHUB_CLIENT_SECRET:your_github_client_secret}
      redirect-uri: ${JUSTAUTH_GITHUB_REDIRECT_URI:http://localhost:8081/api/user/oauth/callback/github}
    WECHAT_OPEN:
      client-id: ${JUSTAUTH_WECHAT_OPEN_CLIENT_ID:your_wechat_open_client_id}
      client-secret: ${JUSTAUTH_WECHAT_OPEN_CLIENT_SECRET:your_wechat_open_client_secret}
      redirect-uri: ${JUSTAUTH_WECHAT_OPEN_REDIRECT_URI:http://localhost:8081/api/user/oauth/callback/wechat}
    QQ:
      client-id: ${JUSTAUTH_QQ_CLIENT_ID:your_qq_client_id}
      client-secret: ${JUSTAUTH_QQ_CLIENT_SECRET:your_qq_client_secret}
      redirect-uri: ${JUSTAUTH_QQ_REDIRECT_URI:http://localhost:8081/api/user/oauth/callback/qq}
    WEIBO:
      client-id: ${JUSTAUTH_WEIBO_CLIENT_ID:your_weibo_client_id}
      client-secret: ${JUSTAUTH_WEIBO_CLIENT_SECRET:your_weibo_client_secret}
      redirect-uri: ${JUSTAUTH_WEIBO_REDIRECT_URI:http://localhost:8081/api/user/oauth/callback/weibo}
  cache:
    type: default

