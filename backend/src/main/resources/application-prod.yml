spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zhibo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=30000
    username: root
    password: 123456
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://elasticsearch:9200}

upload:
  path: /app/uploads
  url-prefix: http://localhost:8081/api/uploads
  use-minio: true

minio:
  endpoint: http://localhost:9000
  public-url: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin123
  bucketName: zhibo-files

justauth:
  mock-mode: false

logging:
  level:
    com.zhibo.backend: INFO
